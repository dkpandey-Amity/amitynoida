  <script>
    (function () {
      const COOKIE_NAME = "first_referrer";

      const COOKIE_DAYS = 30;

      const ROOT_DOMAIN = ".amity.edu";

      // Helper: read a cookie by name

      function getCookie(name) {
        return document.cookie

          .split("; ")

          .reduce((val, pair) => {
            const [key, v] = pair.split("=");

            return key === name ? decodeURIComponent(v) : val;
          }, "");
      }

      // Helper: write a cookie on .amity.edu so it’s shared by all subdomains

      function setCookie(name, value, days) {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();

        document.cookie = [
          `${name}=${encodeURIComponent(value)}`,

          `expires=${expires}`,

          `path=/`,

          `domain=${ROOT_DOMAIN}`,

          `Secure`,

          `SameSite=None`,
        ].join(";");
      }

      // Extract just the hostname (no www.)

      function extractHostname(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return null;
        }
      }

      const existing = getCookie(COOKIE_NAME);

      const referrer = document.referrer || "";

      const refHost = extractHostname(referrer);

      const selfHost = window.location.hostname.replace(/^www\./, "");

      // Only set the cookie if:

      // 1. We don’t already have a first_referrer

      // 2. The referrer is external (not our own root domain)

      if (
        !existing &&
        refHost &&
        !refHost.endsWith(selfHost) // prevents capturing internal links
      ) {
        setCookie(COOKIE_NAME, referrer, COOKIE_DAYS);
      }

      console.log("First referrer is:", getCookie(COOKIE_NAME));
    })();
  </script>
